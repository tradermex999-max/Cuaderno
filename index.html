setTimeout(function(){var b=document.getElementById('boot');if(b&&!b.classList.contains('err')){b.querySelector('small').textContent='Está tardando. Si no abre, ciérrala y vuelve a abrirla.'}},9000);</script></head><body>

<style>
/* Layout: one-screen app — a spiral notebook on a dark oak desk; day, sunset or moonlit room light, a desk lamp base top-left, the tools button top-right, the notebook menu drops from the top */
:root{
  --wood:#3a2416; --paper:#fbfaf3; --ink-type:#1f2c62;
  --ui-bg:#fffdf7; --ui-fg:#2b2925; --ui-mute:#756f63; --accent:#1d3c9b; --danger:#b3261e;
  --felt:#2c313b; --felt-deep:#191c22;
  --hand:'Kalam','Comic Sans MS','Segoe Print',cursive;
  --label:'Patrick Hand','Kalam','Segoe Print',cursive;
  --edges:0 0 1px rgba(0,0,0,.35),1px 1px 0 #e7e2d5,2px 2px 0 #d6d0c0,3px 3px 0 #e4dfd2,4px 4px 0 #c9c2b0,5px 5px 0 #ddd8ca;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--wood);color:var(--ui-fg);font-family:var(--label);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#bg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;pointer-events:none;background:var(--wood) var(--woodimg,none) center top/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(90% 55% at 50% 0%,rgba(255,226,190,.12),transparent 70%),radial-gradient(150% 100% at 50% 45%,transparent 50%,rgba(10,4,0,.55))}
#app{position:relative;height:100%;z-index:1;touch-action:none}
.sun{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none}
#sunMul{z-index:2;mix-blend-mode:multiply}
#sunScr{z-index:3;mix-blend-mode:screen}
#zoom{position:absolute;transform-origin:0 0}
#zoom.anim{transition:transform .32s ease}
#book{position:relative;width:100%;height:100%;perspective:2200px}
.stack{position:absolute;inset:0;background:#efebdf;border-radius:2px 4px 4px 2px;box-shadow:var(--edges),12px 18px 30px rgba(0,0,0,.55),2px 3px 7px rgba(0,0,0,.4)}
body[data-light=tarde] .stack{box-shadow:var(--edges),-20px 26px 34px rgba(0,0,0,.62),-4px 5px 9px rgba(0,0,0,.45)}
body[data-light=noche] .stack{box-shadow:var(--edges),0 10px 26px rgba(0,0,0,.5)}
body[data-light=noche].lamp-on .stack{box-shadow:var(--edges),0 3px 10px rgba(0,0,0,.6),0 14px 34px rgba(0,0,0,.45)}
#leaf{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:0 50%}
#fshadow{position:absolute;inset:0;pointer-events:none;opacity:0;transform:translateZ(-.5px);backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(-3px 5px 6px rgba(30,18,6,.55)) drop-shadow(0 1px 1px rgba(30,18,6,.35))}
#fshadow>div{position:absolute;inset:0;background:#efebdf}
#mid{transform:translateZ(-1px)}
.sheet{position:absolute;inset:0;overflow:hidden;background:var(--paper);border-radius:1px 3px 3px 1px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sheet canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.sheet .txt{position:absolute;left:calc(var(--ml) + 6px);right:10px;top:calc(var(--top) + var(--lh) * .16);height:var(--rulesh);
  margin:0;padding:0;border:0;outline:none;background:transparent;resize:none;overflow:hidden;
  font-family:var(--hand);font-size:calc(var(--lh) * .64);line-height:var(--lh);color:var(--ink-type);
  white-space:pre-wrap;word-wrap:break-word;pointer-events:none;caret-color:var(--ink-type);-webkit-user-select:text;user-select:text;-webkit-touch-callout:none}
.sheet.typing .txt{pointer-events:auto}
.topic{position:absolute;left:calc(var(--ml) + 10px);top:43%;max-width:58%;pointer-events:none;opacity:0;transform:rotate(-3deg);transform-origin:0 50%;
  font:700 calc(var(--lh) * 1.55)/1 var(--hand);color:rgba(58,50,46,.86);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.crease{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.back{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#f3f0e6;border-radius:3px 1px 1px 3px}
.back canvas{position:absolute;inset:0;width:100%;height:100%}
.shade,.cast{position:absolute;inset:0;pointer-events:none;opacity:0}
.cast{right:auto;width:40%;background:linear-gradient(90deg,rgba(40,25,10,.46),rgba(40,25,10,.14) 35%,rgba(40,25,10,0));transform-origin:0 0;will-change:transform,opacity}
#leaf,.cover{will-change:transform}
.sheet .shade,.back .shade{will-change:opacity}
.sheet .shade{background:linear-gradient(90deg,rgba(60,38,12,0) 0%,rgba(60,38,12,.22) 60%,rgba(255,250,238,.5) 89%,rgba(60,38,12,.2) 100%)}
.back .shade{background:linear-gradient(270deg,rgba(60,38,12,.04),rgba(60,38,12,.32))}
.fl{position:absolute;inset:0;pointer-events:none;opacity:0}
.fl.t{background:linear-gradient(to top right,rgba(40,25,10,0) 35%,rgba(40,25,10,.85))}
.fl.b{background:linear-gradient(to bottom right,rgba(40,25,10,0) 35%,rgba(40,25,10,.85))}
.curl{position:absolute;right:0;bottom:0;width:11%;aspect-ratio:1;pointer-events:none;
  background:linear-gradient(135deg,transparent 52%,rgba(0,0,0,.06) 64%,rgba(255,255,255,.7) 70%,transparent 78%)}
.pnum{position:absolute;left:0;right:0;bottom:calc(var(--lh) * .35);text-align:center;font:calc(var(--lh)*.5) var(--label);color:#9aa7b4;letter-spacing:.06em;pointer-events:none}
.cover{position:absolute;inset:0;z-index:3;transform-origin:0 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 6px 6px 2px;overflow:hidden}
.cover canvas{display:block;width:100%;height:100%}
.coils{position:absolute;left:-11px;top:0;bottom:0;width:22px;pointer-events:none;z-index:5}
.coil{position:absolute;left:0;width:22px;height:5px;border-radius:4px;transform:rotate(-14deg);
  background:linear-gradient(180deg,#f4f4f4,#a1a7ae 45%,#5c626a 62%,#cbd0d5);box-shadow:0 1.5px 1.5px rgba(0,0,0,.55)}
body[data-light=tarde] .coil{box-shadow:-1.5px 2px 1.5px rgba(0,0,0,.55)}
#pull{position:absolute;top:0;left:50%;transform:translateX(-50%);width:84px;height:30px;z-index:6;display:flex;align-items:center;justify-content:center;cursor:pointer}
#pull::before{content:"";width:42px;height:5px;border-radius:3px;background:rgba(255,232,200,.32);box-shadow:0 1px 2px rgba(0,0,0,.5)}
#lamp{position:absolute;left:-8px;top:0;width:84px;height:72px;border:0;padding:0;background:none;z-index:6;cursor:pointer;filter:drop-shadow(-5px 8px 7px rgba(0,0,0,.55))}
#lamp svg{display:block}
#lamp .led{transition:fill .15s}
#lamp.on .led{fill:var(--led,#fff1c4);filter:drop-shadow(0 0 3px var(--ledg,#ffd77a))}
#lamp:focus-visible{outline:2px solid #fff;outline-offset:-4px;border-radius:50%}

/* útiles */
#scrim{position:fixed;inset:0;z-index:20;background:rgba(10,5,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#scrim.clear{background:transparent}
#tab{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:25;width:54px;height:54px;border:0;padding:0;border-radius:15px;
  background:linear-gradient(160deg,#3b414d,var(--felt-deep));box-shadow:-6px 9px 16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 5px rgba(0,0,0,.45);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#tab::before{content:"";position:absolute;inset:-10px}
#tab svg{display:block;filter:drop-shadow(1px 1.5px 1px rgba(0,0,0,.55))}
#tab.on{transform:scale(.94);background:linear-gradient(160deg,#4a5260,#262b33)}
#tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
#tray{position:fixed;right:0;top:80px;z-index:30;width:min(440px,calc(100vw - 8px));max-height:calc(100vh - 90px);overflow-y:auto;transform:translateX(112%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  padding:12px calc(10px + env(safe-area-inset-right,0px)) 12px 12px;box-sizing:border-box;
  background:linear-gradient(90deg,var(--felt),var(--felt-deep));border-radius:18px 0 0 18px;
  box-shadow:-10px 8px 28px rgba(0,0,0,.6),inset 2px 0 0 rgba(255,255,255,.1)}
#tray.on{transform:none}
.tools{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:14px 10px 10px 24px;border-radius:12px;overflow-x:auto;overflow-y:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.18));box-shadow:inset 0 4px 12px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.06)}
.tool{flex:0 0 auto;background:none;border:0;padding:0 3px;cursor:pointer;display:block;border-radius:6px}
.tool .rot{position:relative;display:block;transition:transform .22s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(2px 3px 1.6px rgba(0,0,0,.55))}
.tool .rin{position:absolute;left:0;top:0;transform-origin:0 0;display:block}
.tool svg{display:block}
.tool.sel .rot{transform:translateX(-14px)}
.trow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.palette{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding:5px 4px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));max-width:100%;box-sizing:border-box}
.prow{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none}.prow+.prow{padding-top:3px;border-top:1px solid rgba(255,255,255,.1)}
.cp{flex:0 0 auto;border:0;background:none;padding:2px 1px;cursor:pointer;border-radius:5px;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.5))}
.cp svg{display:block}
.cp.sel{background:rgba(255,255,255,.22)}
.cp:focus-visible{outline:2px solid #fff}
.tool:focus-visible{outline:2px solid #fff;outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.act{font:17px var(--label);background:#f4efe3;color:#2b2925;border:0;border-radius:8px;padding:5px 11px;box-shadow:0 2px 0 rgba(0,0,0,.4);cursor:pointer}
.act:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.act:focus-visible{outline:2px solid var(--accent)}

/* menú y ventanitas */
#menu{position:fixed;left:50%;top:0;z-index:35;max-height:100vh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;width:min(320px,calc(100vw - 32px));box-sizing:border-box;transform:translate(-50%,-112%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 6px;
  background:var(--ui-bg);color:var(--ui-fg);border-radius:0 0 18px 18px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px}
#menu.on{transform:translate(-50%,0)}
#menu .grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.18);align-self:center;margin-top:4px}
#menu hr{border:0;border-top:1px solid rgba(43,41,37,.12);margin:2px 8px;width:auto}
.mi{display:flex;align-items:center;gap:12px;font:20px var(--hand);background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--ui-fg);text-align:left;cursor:pointer;width:100%}
.mi:active{background:rgba(0,0,0,.06)}
.mi:focus-visible{outline:2px solid var(--accent)}
.mi svg{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mi.muted .w{display:none}
.mi.danger{color:var(--danger)}
.mi.confirm{background:var(--danger);color:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 10px}
.mrow>span{font:20px var(--hand);flex:0 0 auto}
.seg{display:flex;flex:1;min-width:0;background:#ece6d8;border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;border:0;background:transparent;font:16px var(--label);padding:6px 2px;border-radius:8px;color:var(--ui-fg);cursor:pointer}
.seg button.sel{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.seg button:focus-visible{outline:2px solid var(--accent)}
#pop{position:fixed;z-index:45;width:236px;box-sizing:border-box;background:var(--ui-bg);color:var(--ui-fg);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:6px;display:none;flex-direction:column}
#pop.on{display:flex}
.poptitle{font:14px var(--label);color:var(--ui-mute);padding:6px 10px 2px;letter-spacing:.08em;text-transform:uppercase}
.popin{font:20px var(--hand);margin:6px 8px;padding:6px 10px;border-radius:8px;border:1px solid rgba(43,41,37,.3);background:#fff;color:var(--ui-fg);-webkit-user-select:text;user-select:text;min-width:0}
#ring{position:fixed;width:72px;height:72px;margin:-36px 0 0 -36px;pointer-events:none;z-index:50;opacity:0;transition:opacity .2s}
#ring.on{opacity:1}
#ring circle{fill:none;stroke-width:5}
#ring .trk{stroke:rgba(255,255,255,.55)}
#ring .prog{stroke:#1d3c9b;stroke-linecap:round;stroke-dasharray:182.2;stroke-dashoffset:182.2;transform:rotate(-90deg);transform-origin:50% 50%}
#ring.run .prog{stroke-dashoffset:0;transition:stroke-dashoffset var(--d,4.4s) linear}

/* panel */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:78%;display:flex;flex-direction:column;
  background:var(--ui-bg);color:var(--ui-fg);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.45);
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#panel.on{transform:none}
#panel header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
#panel h2{margin:0;font:700 24px var(--hand);text-wrap:balance}
#panel h3{margin:14px 0 4px;font:700 19px var(--hand)}
#panel .list{overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
#panel .empty{color:var(--ui-mute);font-size:18px;padding:10px 0}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row canvas{flex:0 0 auto;width:56px;height:73px;border-radius:2px;box-shadow:1px 2px 4px rgba(0,0,0,.25)}
.row .info{flex:1;min-width:0;font-size:17px}
.row .info b{display:block;font:700 18px var(--hand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info small{color:var(--ui-mute);font-size:15px}
.row .btns{display:flex;flex-direction:column;gap:6px}
.mini{font:16px var(--label);border:1px solid rgba(43,41,37,.25);background:transparent;color:var(--ui-fg);border-radius:8px;padding:3px 10px;cursor:pointer}
.mini.danger{color:var(--danger);border-color:rgba(179,38,30,.4)}
.mini.confirm{background:var(--danger);color:#fff}
.topicrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px dashed rgba(43,41,37,.2);padding:8px 2px;color:var(--ui-fg);cursor:pointer;font:18px var(--hand)}
.topicrow i{width:14px;height:18px;flex:0 0 auto;clip-path:polygon(0 0,100% 50%,0 100%);background:#d6534d}
.topicrow span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.topicrow em{color:var(--ui-mute);font-style:normal;font-family:var(--label)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 10px}
.cv{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;align-items:center;font:16px var(--hand);color:var(--ui-fg);cursor:pointer;min-width:0}
.cv canvas,.cv .blank{width:84px;height:110px;border-radius:2px 5px 5px 2px;box-shadow:2px 3px 6px rgba(0,0,0,.3)}
.cv .blank{box-sizing:border-box;border:2px dashed rgba(43,41,37,.35);box-shadow:none;display:flex;align-items:center;justify-content:center;font:36px var(--label);color:var(--ui-mute)}
.cv.now canvas{outline:3px solid var(--accent);outline-offset:3px}
.cv small.kd{font:13px var(--label);color:var(--ui-mute);margin-top:-5px}
.nbform .seg{flex:none}
.cv span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbform{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:#f3eee2;margin-bottom:6px}
.nbform label{font-size:16px;color:var(--ui-mute)}
.nbform input{font:20px var(--hand);padding:6px 10px;border-radius:8px;border:1px solid rgba(43,41,37,.3);background:#fff;color:var(--ui-fg);-webkit-user-select:text;user-select:text}
.sw{display:grid;grid-template-columns:repeat(6,30px);gap:10px}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);cursor:pointer}
.swb.sel{box-shadow:0 0 0 3px var(--ui-fg)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:60;box-sizing:border-box;
  background:#2b2925;color:#fffaf0;font:17px var(--label);padding:8px 14px;border-radius:10px;max-width:min(86%,calc(100vw - 180px));text-align:center;
  transition:transform .3s;box-shadow:0 4px 14px rgba(0,0,0,.4);pointer-events:none}
#toast.on{transform:translate(-50%,0)}
#wmAsk,#wmBar{position:fixed;left:50%;transform:translate(-50%,-14px);opacity:0;pointer-events:none;z-index:58;display:flex;align-items:center;gap:8px;
  background:#2b2925;color:#fffaf0;font:17px var(--label);padding:7px 8px 7px 14px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:opacity .25s,transform .25s;white-space:nowrap;overflow:hidden;box-sizing:border-box;max-width:calc(100vw - 24px)}
#wmAsk{top:calc(78px + env(safe-area-inset-top,0px))}
#wmBar{top:calc(14px + env(safe-area-inset-top,0px));font-size:15px;background:rgba(43,41,37,.9);padding:5px 6px 5px 12px;gap:6px}
#wmAsk.on,#wmBar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#wmAsk button,#wmBar button{font:16px var(--label);border:0;border-radius:9px;padding:6px 13px;cursor:pointer;background:rgba(255,250,240,.14);color:#fffaf0}
#wmBar button{font-size:15px;padding:5px 10px}
#wmAsk #wmYes{background:#fffaf0;color:#2b2925}
#wmAsk .wmt{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(255,250,240,.55);transform-origin:0 50%}
#wmAsk.on .wmt{animation:wmT 5s linear forwards}
@keyframes wmT{to{transform:scaleX(0)}}

.view{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:15;overflow:hidden;background:#24160c;touch-action:none}
.view canvas.scene{position:absolute;left:0;top:0;width:100%;height:100%}

let DB=null,fresh=false;

if(!DB.ruler)DB.ruler={on:false,x:500,y:0,a:0};if(DB.shelfLamp==null)DB.shelfLamp=true;if(DB.candle==null)DB.candle=true;if(DB.lamp2==null)DB.lamp2=true;if(DB.tool==='regla')DB.tool=DB.ink;

/* ---------- sonidos: síntesis física, sin archivos ---------- */
const SFX=(function(){
  let ctx=null,master=null,dry=null,sr=48000,amb=null,ambWant=null,cricketBuf=null;const loops={};

  function init(){if(ctx)return ctx;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ctx=new C()}catch(e){return null}

    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.attack.value=.003;comp.release.value=.12;

    master=ctx.createGain();master.connect(comp);

    setTimeout(()=>{try{loop(SCR[DB.tool]?SCR[DB.tool].k:'graf')}catch(e){}},300);
    return ctx}
  function unlock(){if(DB.sound===false&&!mch)return;const c=init();if(!c)return;if(c.state!=='running')c.resume().then(refreshAmb).catch(()=>{});else refreshAmb()}
  const on=()=>DB.sound!==false&&ctx&&ctx.state==='running';
  function roomIR(){const n=Math.floor(.45*sr),b=ctx.createBuffer(2,n,sr);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;

      for(const ms of [5,9,14,19,27,36]){const i=Math.floor(ms/1000*sr*(1+ch*.06));if(i<n)d[i]+=(Math.random()<.5?-1:1)*.45*Math.exp(-ms/45)}}
    return b}
  function Bq(type,f,Q,gDb){const s={x1:0,x2:0,y1:0,y2:0};let b0,b1,b2,a1,a2;

      if(type==='lp'){b0=(1-cs)/2;b1=1-cs;b2=b0;a0=1+al;a1=-2*cs;a2=1-al}
      else if(type==='hp'){b0=(1+cs)/2;b1=-(1+cs);b2=b0;a0=1+al;a1=-2*cs;a2=1-al}
      else if(type==='bp'){b0=al;b1=0;b2=-al;a0=1+al;a1=-2*cs;a2=1-al}
      else{b0=1+al*A;b1=-2*cs;b2=1-al*A;a0=1+al/A;a1=-2*cs;a2=1-al/A}
      b0/=a0;b1/=a0;b2/=a0;a1/=a0;a2/=a0}
    set(f);const run=x=>{const y=b0*x+b1*s.x1+b2*s.x2-a1*s.y1-a2*s.y2;s.x2=s.x1;s.x1=x;s.y2=s.y1;s.y1=y;return y};run.set=set;return run}
  const N=d=>new Float32Array(Math.max(1,Math.floor(d*sr)));
  function noise(d){const a=N(d);for(let i=0;i<a.length;i++)a[i]=rnd();return a}
  function filt(a,...fs){for(const f of fs)for(let i=0;i<a.length;i++)a[i]=f(a[i]);return a}
  function sweep(a,type,f0,f1,Q){const q=Bq(type,f0,Q),n=a.length;for(let i=0;i<n;i++){if((i&127)===0)q.set(f0*Math.pow(f1/f0,i/n));a[i]=q(a[i])}return a}
  function env(a,fn){for(let i=0;i<a.length;i++)a[i]*=fn(i/sr);return a}
  function mix(dst,src,g,at){const o=Math.floor((at||0)*sr);for(let i=0;i<src.length&&o+i<dst.length;i++)dst[o+i]+=src[i]*g;return dst}
  function grains(a,t0,t1,rate,amp,lmin,lmax,dec){let t=t0;
    for(;;){const r=rate(t);t+=r>0?-Math.log(1-Math.random())/r:.003;if(t>=t1)break;if(r<=0)continue;
      const A=amp(t),len=Math.max(2,Math.floor((lmin+Math.random()*(lmax-lmin))*sr)),i0=Math.floor(t*sr),k=(dec||5)/len;
      for(let j=0;j<len&&i0+j<a.length;j++)a[i0+j]+=rnd()*A*Math.exp(-j*k)}return a}
  function modes(a,at,list,amp){const i0=Math.floor(at*sr);
    for(const [f,dk,rel] of list){const n=Math.min(a.length-i0,Math.floor(dk*6*sr)),w=2*Math.PI*f/sr,ph=Math.random()*6.28;
      for(let j=0;j<n;j++)a[i0+j]+=Math.sin(w*j+ph)*amp*rel*Math.exp(-j/(dk*sr))}return a}

  /* lápiz de madera chocando con otro: clic brillante y corto */
  function pencilClick(a,at,amp){const f=1+(Math.random()-.5)*.35;click(a,at,amp*.5,9000);modes(a,at,[[1650*f,.016,1],[2900*f,.011,.7],[4300*f,.007,.45],[6100*f,.005,.25]],amp*.32)}
  function wire(a,at,amp){modes(a,at,[[2050+Math.random()*500,.06,1],[3350+Math.random()*200,.045,.6],[5200,.03,.4],[7700,.018,.25]],amp)}
  function play(a,vol,at){if(!ctx)return;let m=0;for(let i=0;i<a.length;i++){const v=Math.abs(a[i]);if(v>m)m=v}const k=m>0?vol/m:0;
    const b=ctx.createBuffer(1,a.length,sr),d=b.getChannelData(0);for(let i=0;i<a.length;i++)d[i]=a[i]*k;

  const S={
    flip(land){const d=.85,o=N(d);let thick=false;try{thick=B().kind==='dibujo'}catch(e){}

      else{const sl=noise(.05);env(sl,t=>Math.exp(-t/.01));filt(sl,Bq('lp',2000,.7));mix(o,sl,.18,.62)}

    flex(k){const d=.13,o=N(d);grains(o,0,.11,()=>500+k*1500,()=>.8*pl(2.5),.0004,.003,6);filt(o,Bq('hp',1500,.7));
      const a=noise(d);filt(a,Bq('bp',1600,.7));env(a,t=>Math.sin(Math.PI*t/d));mix(o,a,.15);play(o,.22)},
    pop(){const d=.06,o=N(d);const p=noise(.006);env(p,t=>Math.exp(-t/.0012));filt(p,Bq('hp',900,.7),Bq('pk',2400,2,6));mix(o,p,.9);
      grains(o,.002,.045,()=>1800,()=>.5*pl(2),.0003,.002,6);modes(o,0,[[1500+Math.random()*500,.006,1]],.08);filt(o,Bq('hp',450,.7));play(o,.3+Math.random()*.1)},
    tear(){const d=1,o=N(d),T=.5,sh=t=>t<.04?t/.04:t<T?1-.35*(t/T):0;
      const fine=N(d);grains(fine,0,T,t=>3200*sh(t),()=>.7*pl(2.2),.0003,.0015,6);filt(fine,Bq('hp',2000,.7));mix(o,fine,.7);
      const coarse=N(d);grains(coarse,0,T,t=>260*sh(t),()=>pl(1.5),.002,.007,5);filt(coarse,Bq('bp',1600,.9));mix(o,coarse,.8);
      for(let t=.01;t<T;t+=.018+Math.random()*.01){const p=noise(.005);env(p,x=>Math.exp(-x/.001));filt(p,Bq('hp',900,.7));mix(o,p,.5*(.6+.4*Math.random()),t)}

function specRun(){const st=$('#stereo'),fake=!MUS.playing&&(RADIO.playing||!!(SP&&SP.playing)),

  const bars=[...st.querySelectorAll('.eq i')],lv=bars.map(()=>0);const f=t=>{if(!ok()){specRAF=0;bars.forEach(b=>b.style.height='2px');return}
    const an=MUS.playing?SFX.analyser():(RADIO.playing?SFX.analyser2():null);let real=false;
    if(an){an.getByteFrequencyData(SPEC);let m0=0;for(let k=0;k<SPEC.length;k++)m0=Math.max(m0,SPEC[k]);real=m0>2}
    if(real){bars.forEach((b,i)=>{const a=Math.floor(Math.pow(i/bars.length,1.7)*90)+1,e=Math.floor(Math.pow((i+1)/bars.length,1.7)*90)+2;let m=0;for(let k=a;k<e;k++)m=Math.max(m,SPEC[k]);b.style.height=(2+16*m/255).toFixed(1)+'px'})}
    else{const beat=Math.pow(Math.max(0,Math.sin(t/1000*Math.PI*1.5)),8);
      bars.forEach((b,i)=>{const x=i/Math.max(1,bars.length-1),base=.62-.42*x,tg=Math.min(1,base*(.5+.5*Math.random())+beat*(1-x)*.38);lv[i]+=(tg-lv[i])*(tg>lv[i]?.42:.1);b.style.height=(2+16*lv[i]).toFixed(1)+'px'})}
    specRAF=requestAnimationFrame(f)};specRAF=requestAnimationFrame(f)}
